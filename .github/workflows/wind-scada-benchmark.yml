name: CARE v6 Wind SCADA Benchmark

# CI trigger: validate PR #11 on the full CARE v6 benchmark.
on:
  pull_request:
    paths:
      - "src/tsdiag/datasets/wind_care.py"
      - "src/tsdiag/tools/wind_scada.py"
      - "src/tsdiag/domain/**"
      - "src/tsdiag/detectors/**"
      - "src/tsdiag/domains/wind_scada*"
      - "src/tsdiag/evaluation/wind_scada.py"
      - "src/tsdiag/benchmarks/wind_scada.py"
      - "scripts/run_wind_scada_benchmark.py"
      - "tests/test_wind*"
      - "tests/test_residual_changepoint.py"
      - ".github/workflows/wind-scada-benchmark.yml"
  workflow_dispatch:

concurrency:
  group: care-v6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wind-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Wind SCADA tests
        run: |
          pytest -q \
            tests/test_wind_scada.py \
            tests/test_wind_scada_evaluation.py \
            tests/test_wind_physics.py \
            tests/test_residual_changepoint.py

  care-v6-real-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: wind-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Check disk
        run: df -h
      - name: Download official CARE v6 archive
        run: |
          curl --fail --location --retry 4 --retry-delay 10 \
            --output CARE_To_Compare.zip \
            "https://zenodo.org/records/15846963/files/CARE_To_Compare.zip?download=1"
          ls -lh CARE_To_Compare.zip
      - name: Run complete 95-event CARE v6 benchmark
        run: |
          python scripts/run_wind_scada_benchmark.py \
            --data-dir CARE_To_Compare.zip \
            --output-dir outputs/wind_benchmark
      - name: Show CARE v6 summary
        if: always()
        run: |
          if [ -f outputs/wind_benchmark/care_v6_summary.md ]; then
            cat outputs/wind_benchmark/care_v6_summary.md
          fi
          if [ -f outputs/wind_benchmark/wind_scada_benchmark.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path("outputs/wind_benchmark/wind_scada_benchmark.json")
          result = json.loads(p.read_text())
          print(json.dumps(result["summary"], indent=2))
          if result.get("failures"):
              print("Failures:")
              print(json.dumps(result["failures"], indent=2))
          PY
          fi
      - name: Upload benchmark outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: care-v6-wind-benchmark
          path: outputs/wind_benchmark/**
          if-no-files-found: warn
