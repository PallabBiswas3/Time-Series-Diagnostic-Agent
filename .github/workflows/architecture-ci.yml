name: Architecture CI

on:
  pull_request:
    paths:
      - "src/tsdiag/core/**"
      - "src/tsdiag/verification/**"
      - "src/tsdiag/contracts.py"
      - "src/tsdiag/models.py"
      - "src/tsdiag/domains/planner.py"
      - "src/tsdiag/domains/runtime_adapters.py"
      - "src/tsdiag/domains/__init__.py"
      - "src/tsdiag/__init__.py"
      - "tests/test_core_runtime.py"
      - "tests/test_runtime_adapters_verification.py"
      - "tests/test_domain_packs.py"
      - "tests/test_diagnostic_contract.py"
      - ".github/workflows/architecture-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/tsdiag/core/**"
      - "src/tsdiag/verification/**"
      - "src/tsdiag/contracts.py"
      - "src/tsdiag/models.py"
      - "src/tsdiag/domains/planner.py"
      - "src/tsdiag/domains/runtime_adapters.py"
      - "src/tsdiag/domains/__init__.py"
      - "src/tsdiag/__init__.py"
      - "tests/test_core_runtime.py"
      - "tests/test_runtime_adapters_verification.py"
      - "tests/test_domain_packs.py"
      - "tests/test_diagnostic_contract.py"

jobs:
  contracts-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Run architecture tests
        run: >-
          pytest -q
          tests/test_core_runtime.py
          tests/test_runtime_adapters_verification.py
          tests/test_domain_packs.py
          tests/test_diagnostic_contract.py
